<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <div class="card login-card">

        <h2 class="page-title">Регистрация</h2>

        <form th:action="@{/register}" method="post" th:object="${user}" class="auth-form">

            <label class="form-label">Имя пользователя</label>
            <input type="text" th:field="*{username}" class="form-input" required>

            <label class="form-label">Пароль</label>
            <input type="password" th:field="*{passwordHash}" class="form-input" required>

            <label class="form-label">ФИО</label>
            <input type="text" th:field="*{fullName}" class="form-input" required>

            <button type="submit" class="btn btn-large" style="width:100%; margin-top:16px;">
                Создать аккаунт
            </button>
        </form>

        <p th:if="${error}" th:text="${error}" class="error-msg"></p>

        <div class="center" style="margin-top:14px;">
            <a href="/login" class="auth-link">Уже есть аккаунт? Войти</a>
        </div>

    </div>
</div>

</body>
</html>
