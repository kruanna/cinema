<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Сеанс</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="container">
    <div class="card">

        <h2 th:text="${session.id != null ? 'Редактировать сеанс' : 'Добавить сеанс'}"></h2>

        <!-- Сообщение об успешном добавлении -->
        <div class="success" th:if="${success}">
            <p th:text="${success}"></p>
        </div>

        <form th:action="@{/sessions/save}" method="post" th:object="${session}" class="form-grid">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- Фильмы -->
            <label>Фильм:</label>
            <select th:field="*{movie}">
                <option value="">Выберите фильм</option>
                <option th:each="m : ${movies}"
                        th:value="${m.id}"
                        th:text="${m.title}">
                </option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('movie')}" th:errors="*{movie}"></p>

            <!-- Дата -->
            <label>Дата:</label>
            <input type="date" th:field="*{date}">
            <p class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></p>

            <!-- Время -->
            <label>Время:</label>
            <input type="time" th:field="*{time}">
            <p class="error" th:if="${#fields.hasErrors('time')}" th:errors="*{time}"></p>

            <!-- Цена -->
            <label>Цена (₽):</label>
            <input type="number" th:field="*{price}" min="1">
            <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>

            <button type="submit" class="btn" style="margin-top:15px;">Сохранить</button>
            <a href="/sessions" class="btn btn-small" style="margin-top:15px;">Отмена</a>

        </form>

    </div>
</div>

<div th:if="${success}" class="modal-overlay">
    <div class="modal-window">
        <h3 th:text="${success}"></h3>
        <a th:href="${redirectUrl}" class="btn">Закрыть</a>
    </div>
</div>

</body>
</html>
